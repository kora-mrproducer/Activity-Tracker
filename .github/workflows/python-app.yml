name: Personal Edition checks
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m flake8 . --select=E9,F63,F7,F82 --show-source
      - run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend-security.cjs
  windows-package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.20.0
      - run: python -m PyInstaller --clean --noconfirm ActivityTracker.spec
      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $env:ACTIVITY_TRACKER_DATA_DIR = Join-Path $env:RUNNER_TEMP 'tracker-smoke'
          $env:ACTIVITY_TRACKER_NO_GRACE = '1'
          $process = Start-Process -FilePath '.\dist\ActivityTracker\ActivityTracker.exe' -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:5000/health'
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch {}
              if ($process.HasExited) { throw 'Executable exited during startup' }
            }
            if (-not $healthy) { throw 'Packaged application did not become healthy' }
            $export = Invoke-WebRequest 'http://127.0.0.1:5000/export/all'
            if ($export.StatusCode -ne 200) { throw 'Packaged export failed' }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ActivityTracker-Windows-Personal-Edition
          path: dist/ActivityTracker/
